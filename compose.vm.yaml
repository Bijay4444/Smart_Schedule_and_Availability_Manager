name: smart-schedule-vm

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to the locally loaded release tag}
  pull_policy: never
  init: true
  read_only: true
  tmpfs: [/tmp:mode=1777]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  environment:
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    DJANGO_SETTINGS_MODULE: config.django.production
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate a private VM environment}
    DJANGO_DEBUG: "false"
    # Optional second DNS name keeps the original Azure URL working when a
    # custom domain becomes primary. Omitted aliases add no empty list entry.
    DJANGO_ALLOWED_HOSTS: ${APP_HOST:?Set the actual public DNS hostname}${APP_HOST_ALIAS:+,}${APP_HOST_ALIAS:-}
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${APP_HOST}${APP_HOST_ALIAS:+,https://}${APP_HOST_ALIAS:-}
    DJANGO_TRUST_X_FORWARDED_PROTO: "true"
    DJANGO_SECURE_SSL_REDIRECT: "true"
    DJANGO_SESSION_COOKIE_SECURE: "true"
    DJANGO_CSRF_COOKIE_SECURE: "true"
    DJANGO_SECURE_HSTS_SECONDS: "3600"
    DATABASE_URL: ""
    PGDATABASE: smart_schedule
    PGUSER: smart_schedule
    PGPASSWORD: ${POSTGRES_PASSWORD:?Generate a private VM environment}
    PGHOST: db
    PGPORT: "5432"
    # Both processes are on the same VM's private Docker network. PostgreSQL
    # has no published port. Public HTTPS terminates at Caddy, not at Django.
    PGSSLMODE: disable
    WEB_CONCURRENCY: "1"
    GUNICORN_THREADS: "2"
  networks: [frontend, backend]

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: smart_schedule
      POSTGRES_USER: smart_schedule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a private VM environment}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *logging
    restart: unless-stopped

  migrate:
    <<: *app
    profiles: [ops]
    command: [python, manage.py, migrate, --noinput]
    healthcheck: {disable: true}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  web:
    <<: *app
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 35s

  proxy:
    image: caddy:2.11.9-alpine
    environment:
      APP_HOST: ${APP_HOST:?Set the actual public DNS hostname}
      APP_HOST_ALIAS: ${APP_HOST_ALIAS:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped

networks:
  frontend:
  backend: {internal: true}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
