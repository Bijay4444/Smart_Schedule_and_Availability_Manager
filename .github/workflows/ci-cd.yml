name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: PostgreSQL tests and Docker rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_schedule
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_schedule"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smart_schedule
      PGSSLMODE: disable
      DJANGO_SETTINGS_MODULE: config.django.test
      BICEP_BIN: bicep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install locked Python environment
        run: |
          uv python install 3.13.15
          uv sync --locked --python 3.13.15
      - name: Install verified Bicep compiler
        run: |
          curl --fail --location --retry 3 https://github.com/Azure/bicep/releases/download/v0.49.2/bicep-linux-x64 --output "$RUNNER_TEMP/bicep"
          printf '%s  %s\n' '0ab9de90c2493f206f8281bae74f9ee2d5ed3605548dab1adf41fef185e1f7c5' "$RUNNER_TEMP/bicep" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/bicep"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check Django, migrations, infrastructure and tests
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          bicep build infra/azure/github-actions.bicep --outfile "$RUNNER_TEMP/github-actions.json"
          uv run pytest -q --tb=short
      - name: Build runtime image
        run: docker build --platform linux/amd64 --target runtime --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "smart-schedule:$GITHUB_SHA" .
      - name: Rehearse HTTPS, login, persistence and backup restore
        env:
          VM_TEST_IMAGE: smart-schedule:${{ github.sha }}
        run: uv run pytest tests/test_vm_docker_integration.py -q --tb=short
      - name: Package the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker image save --output "$RUNNER_TEMP/app-image.tar" "smart-schedule:$GITHUB_SHA"
          uv run python scripts/package_vm_release.py --archive "$RUNNER_TEMP/app-image.tar" --commit "$GITHUB_SHA" --output release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: vm-release-${{ github.sha }}
          path: release/
          retention-days: 1
          compression-level: 6
          overwrite: true
          if-no-files-found: error

  deploy:
    name: Deploy production VM
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://schedule.khadkabijay.com.np
    concurrency:
      group: production-vm
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_NSG: ${{ vars.AZURE_NSG }}
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit is on main; this run will not overwrite it.'
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.current.outputs.deploy == 'true'
        with:
          name: vm-release-${{ github.sha }}
          path: release
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.current.outputs.deploy == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare dedicated SSH credentials
        if: steps.current.outputs.deploy == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/production_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          test -s "$RUNNER_TEMP/production_key"
          test -s "$HOME/.ssh/known_hosts"
      - name: Allow only this runner's SSH address
        id: access
        if: steps.current.outputs.deploy == 'true'
        run: |
          address=$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)
          python3 -c 'import ipaddress,sys; ip=ipaddress.ip_address(sys.argv[1]); assert ip.version == 4 and ip.is_global' "$address"
          az network nsg rule create --resource-group "$AZURE_RESOURCE_GROUP" --nsg-name "$AZURE_NSG" --name GitHubActionsSSH --priority 120 --direction Inbound --access Allow --protocol Tcp --source-address-prefixes "$address/32" --source-port-ranges '*' --destination-address-prefixes '*' --destination-port-ranges 22 --only-show-errors --output none
      - name: Upload and install the verified release
        if: steps.current.outputs.deploy == 'true'
        timeout-minutes: 18
        run: |
          target="$VM_USER@$VM_HOST"
          incoming="/opt/smart-schedule/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          options=(-i "$RUNNER_TEMP/production_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15)
          ssh "${options[@]}" "$target" "mkdir -p '$incoming'"
          scp -C "${options[@]}" -r release/. "$target:$incoming/"
          ssh "${options[@]}" "$target" "sudo python3 '$incoming/install_release.py' '$incoming' '$GITHUB_SHA'"
      - name: Check the public deployment
        if: steps.current.outputs.deploy == 'true'
        run: python3 scripts/check_deployment.py "$APP_URL"
      - name: Remove temporary SSH access
        if: always() && steps.access.outcome != 'skipped' && steps.access.outcome != ''
        run: az network nsg rule delete --resource-group "$AZURE_RESOURCE_GROUP" --nsg-name "$AZURE_NSG" --name GitHubActionsSSH --only-show-errors
      - name: Remove runner's private key
        if: always()
        run: rm -f "$RUNNER_TEMP/production_key"
