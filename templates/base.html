{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Smart Schedule{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
  </head>
  <body>
    <header class="site-header border-bottom bg-white">
      <nav class="container py-3 d-flex flex-wrap align-items-center justify-content-between gap-3" aria-label="Account navigation">
        <a class="brand text-decoration-none" href="{% url 'home' %}">Smart Schedule</a>
        {% if user.is_authenticated %}
          <div class="d-flex flex-wrap align-items-center gap-3">
            <a class="text-decoration-none text-secondary" href="{% url 'scheduling:commitment_list' %}">Commitments</a>
            <span class="text-secondary">{{ user.username }}</span>
            <form action="{% url 'logout' %}" method="post">
              {% csrf_token %}
              <button class="btn btn-outline-secondary btn-sm" type="submit">Sign out</button>
            </form>
          </div>
        {% endif %}
      </nav>
    </header>
    <main class="container py-5" id="main-content">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" role="status">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
