[project]
name = "smart-schedule-and-availability-manager"
version = "0.1.0"
description = "A scheduling and work availability manager."
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django==6.1.2",
    "django-environ>=0.12,<1",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.11,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.django.test"
pythonpath = ["."]
testpaths = ["tests"]
